<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블 연습</title>
</head>
<body>
    <table border="1">
        <tr>
            <td colspan="4">A</td>
        </tr>
        <tr>
            <td rowspan="2">B</td><td colspan="3">C</td>
        </tr>
        <tr>
            <td>D</td><td>E</td><td>F</td>
        </tr>
        <tr>
            <td rowspan="2" colspan="2">G</td><td>H</td><td>3</td><td>4</td>
        </tr>
        <tr>
            <td>1</td><td>2</td><td>3</td><td>4</td>
        </tr>
    </table>
</body>
</html>
