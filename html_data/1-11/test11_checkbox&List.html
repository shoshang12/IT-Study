<body>

    <input type="checkbox" id="apple" name="apple" value="apple">
    <label for="apple">apple</label><br>
    <input type="checkbox" id="orange" name="orange" value="orange" checked>
    <label for="orange">orange</label><br>
  </fieldset>
  <fieldset>
    <legend>하나만 선택</legend>
        <input type="radio" id="kenyaAA" name="coffee" value="kenyaAA">

        <input type="radio" id="supremo" name="coffee" value="supremo" checked>
        <label for="supremo">수프리모</label>
    </fieldset>
